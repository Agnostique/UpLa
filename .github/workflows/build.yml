name: Build UpLa

on:
  push:
    branches:
      - "**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**/*.md"
      - "**/*.gitignore"
      - "**/*.gitattributes"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Release
          - Debug
        platform:
          - x64
          - ARM64

    env:
      SOLUTION_FILE_PATH: ShareX.sln
      ASSEMBLY_INFO_PATH: Directory.build.props
      API_KEYS_PATH: ShareX.UploadersLib\APIKeys\APIKeysLocal.cs

    outputs:
      APP_VERSION: ${{ env.APP_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set PLATFORM & RUNTIME_ID
        run: |
          $platform = if ("${{ matrix.platform }}" -eq "ARM64") { "arm64" } else { "x64" }
          echo "PLATFORM=$platform" >> $env:GITHUB_ENV
          echo "RUNTIME_ID=win-$platform" >> $env:GITHUB_ENV

      # The UpLa version (<InformationalVersion>) names the setup and zip files. <Version> stays the ShareX version
      # because settings files use it for their upgrade steps.
      - name: Set APP_VERSION
        run: |
          $content = Get-Content "${{ env.ASSEMBLY_INFO_PATH }}" -Raw
          $pattern = '<InformationalVersion>([0-9]+(?:\.[0-9]+){1,3})</InformationalVersion>'
          $match = [regex]::Match($content, $pattern)
          if (-not $match.Success) { throw "InformationalVersion not found in ${{ env.ASSEMBLY_INFO_PATH }}" }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF -eq "refs/heads/develop") {
            $version = "$version.$env:GITHUB_RUN_NUMBER"
            $content = [regex]::Replace($content, $pattern, "<InformationalVersion>$version</InformationalVersion>")
            Set-Content -Path "${{ env.ASSEMBLY_INFO_PATH }}" -Value "$content" -NoNewline
          }
          echo $version
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV

      # The upla.com.tr guest key is kept out of the repository. The API_KEYS_LOCAL secret holds the whole
      # APIKeysLocal.cs file. Without it guest uploads do not work, so a tagged release must not be built without it.
      - name: Create API keys
        env:
          API_KEYS_LOCAL: ${{ secrets.API_KEYS_LOCAL }}
        run: |
          if ($env:API_KEYS_LOCAL) {
            Set-Content -Path "${{ env.API_KEYS_PATH }}" -Value $env:API_KEYS_LOCAL -Encoding utf8
          } elseif ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            throw "The API_KEYS_LOCAL secret is required to build a release."
          } else {
            echo "::warning::API_KEYS_LOCAL secret is not set: guest uploads will not work in this build."
            Set-Content -Path "${{ env.API_KEYS_PATH }}" -Value "namespace ShareX.UploadersLib { internal static partial class APIKeys { } }" -Encoding utf8
          }

      - name: Restore NuGet packages
        run: |
          dotnet restore --runtime "${{ env.RUNTIME_ID }}" "${{ env.SOLUTION_FILE_PATH }}"
          if ("${{ matrix.platform }}" -eq "ARM64") {
            # ShareX.Setup always builds as x64, so restore win-x64 packages too
            dotnet restore --runtime "win-x64" "ShareX.Setup\ShareX.Setup.csproj"
          }

      - name: Build
        run: dotnet build --no-restore --configuration "${{ matrix.configuration }}" -p:Platform="${{ matrix.platform }}" --self-contained true /m:1 "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build Setup (x64)
        if: matrix.platform == 'ARM64'
        run: |
          # Build ShareX.Setup and its dependencies for x64 since it can't run as ARM64 on CI
          dotnet build --configuration "${{ matrix.configuration }}" -p:Platform="x64" --self-contained true "ShareX.Setup\ShareX.Setup.csproj"

      - name: Setup
        working-directory: ${{ env.GITHUB_WORKSPACE }}
        run: |
          & "ShareX.Setup\bin\${{ matrix.configuration }}\win-x64\ShareX.Setup.exe" -silent -job "${{ matrix.configuration }}" -platform "${{ matrix.platform }}"

      - name: Upload artifact (Setup)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: Setup-${{ matrix.platform }}
          path: Output\UpLa-${{ env.APP_VERSION }}-setup-${{ env.PLATFORM }}.exe
          if-no-files-found: error

      - name: Upload artifact (Portable)
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: Portable-${{ matrix.platform }}
          path: Output\UpLa-${{ env.APP_VERSION }}-portable-${{ env.PLATFORM }}.zip
          if-no-files-found: error

      - name: Upload artifact (Debug)
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v7
        with:
          name: Debug-${{ matrix.platform }}
          path: Output\UpLa-${{ env.APP_VERSION }}-debug-${{ env.PLATFORM }}.zip
          if-no-files-found: error

  # Tags (v2.0.1 etc.) create a draft release with the x64 setup and portable zip; nothing is published automatically.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      RELEASE_BODY_PATH: RELEASE_BODY.md
      APP_VERSION: ${{ needs.build.outputs.APP_VERSION }}

    steps:
      - name: Download artifact (Setup-x64)
        uses: actions/download-artifact@v8
        with:
          name: Setup-x64
          path: Output

      - name: Download artifact (Portable-x64)
        uses: actions/download-artifact@v8
        with:
          name: Portable-x64
          path: Output

      # Copies without the version give the website a link that always downloads the latest release:
      # https://github.com/<owner>/UpLa/releases/latest/download/UpLa-setup-x64.exe
      - name: Add copies without version
        run: |
          Copy-Item "Output\UpLa-${{ env.APP_VERSION }}-setup-x64.exe" "Output\UpLa-setup-x64.exe"
          Copy-Item "Output\UpLa-${{ env.APP_VERSION }}-portable-x64.zip" "Output\UpLa-portable-x64.zip"

      - name: Create release body file
        run: |
          $checksums = Get-ChildItem -Path "Output\" -Recurse -File
            | Sort-Object -Property Name
            | ForEach-Object { "| $($_.Name) | ``$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)`` |" }
            | Out-String
          $output = "| File | SHA256 |`r`n| --- | --- |`r`n$($checksums.Trim())"
          echo $output >> $env:GITHUB_STEP_SUMMARY
          echo $output
          Set-Content -Path "${{ env.RELEASE_BODY_PATH }}" -Value "$output" -NoNewline

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: UpLa ${{ env.APP_VERSION }}
          body_path: ${{ env.RELEASE_BODY_PATH }}
          draft: true
          prerelease: false
          files: |
            Output/UpLa-${{ env.APP_VERSION }}-setup-x64.exe
            Output/UpLa-${{ env.APP_VERSION }}-portable-x64.zip
            Output/UpLa-setup-x64.exe
            Output/UpLa-portable-x64.zip
